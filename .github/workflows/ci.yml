name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-strategy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Jesse
        run: |
          python -m pip install --upgrade pip
          pip install jesse

      - name: Configure .env
        run: |
          cp .env.example .env

      - name: Verify strategies import
        run: python -c "import jesse; from strategies.ExampleStrategy import ExampleStrategy; print('ExampleStrategy OK')"

      - name: Run smoke backtest
        run: python smoke_test.py